<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="1180" fill="#ffffff"/>
  <text x="450" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#111">Porta-fusível do processador no cabo C4</text>
  <text x="450" y="68" font-size="16" text-anchor="middle" fill="#555">Fonte fora da tomada · fusível só entra no passo 4.7</text>

  <!-- ===== 1. Peças ===== -->
  <g transform="translate(0,90)">
    <rect x="30" y="0" width="840" height="200" rx="12" fill="#f6f7f9" stroke="#d0d4da"/>
    <text x="50" y="30" font-size="18" font-weight="bold" fill="#111">1 · As peças</text>
    <!-- porta-fusível -->
    <rect x="360" y="60" width="180" height="70" rx="10" fill="#2b2b2b"/>
    <rect x="395" y="48" width="110" height="24" rx="6" fill="#444"/>
    <text x="450" y="112" font-size="13" text-anchor="middle" fill="#fff">porta-fusível (vazio)</text>
    <!-- rabichos -->
    <line x1="250" y1="95" x2="360" y2="95" stroke="#e53935" stroke-width="8"/>
    <line x1="540" y1="95" x2="650" y2="95" stroke="#e53935" stroke-width="8"/>
    <text x="305" y="80" font-size="13" text-anchor="middle" fill="#b71c1c" font-weight="bold">PF1</text>
    <text x="595" y="80" font-size="13" text-anchor="middle" fill="#b71c1c" font-weight="bold">PF2</text>
    <text x="305" y="125" font-size="12" text-anchor="middle" fill="#555">rabicho: fio que já vem preso (≈10 cm)</text>
    <text x="595" y="125" font-size="12" text-anchor="middle" fill="#555">fio que já vem preso (≈10 cm)</text>
    <!-- C4 cortado -->
    <line x1="60" y1="165" x2="170" y2="165" stroke="#9e9e9e" stroke-width="8"/>
    <text x="115" y="150" font-size="13" text-anchor="middle" fill="#333">C4-1 · 10 cm</text>
    <text x="115" y="188" font-size="12" text-anchor="middle" fill="#555">vai ao borne 2 (+) da fonte</text>
    <line x1="700" y1="165" x2="850" y2="165" stroke="#9e9e9e" stroke-width="8"/>
    <text x="775" y="150" font-size="13" text-anchor="middle" fill="#333">C4-2 · 40 cm</text>
    <text x="775" y="188" font-size="12" text-anchor="middle" fill="#555">vai ao +12VDC do processador</text>
    <text x="450" y="178" font-size="14" text-anchor="middle" fill="#333">Emenda A = C4-1 + PF1 · Emenda B = C4-2 + PF2</text>
  </g>

  <!-- ===== 2. Tubo antes ===== -->
  <g transform="translate(0,310)">
    <rect x="30" y="0" width="840" height="190" rx="12" fill="#f6f7f9" stroke="#d0d4da"/>
    <text x="50" y="30" font-size="18" font-weight="bold" fill="#111">2 · Desencapar 15 mm (C4-1, C4-2, PF1, PF2) e enfiar o tubo ANTES</text>
    <!-- rabicho com tubo -->
    <line x1="120" y1="110" x2="330" y2="110" stroke="#e53935" stroke-width="8"/>
    <line x1="330" y1="110" x2="400" y2="110" stroke="#c77f3c" stroke-width="5"/>
    <rect x="180" y="97" width="80" height="26" rx="8" fill="#1e88e5" opacity="0.85"/>
    <text x="220" y="88" font-size="12" text-anchor="middle" fill="#0d47a1" font-weight="bold">tubo de 4 mm, enfiado no PF1 (e outro no PF2)</text>
    <text x="220" y="145" font-size="12" text-anchor="middle" fill="#555">empurrado para longe da ponta</text>
    <text x="365" y="140" font-size="12" text-anchor="middle" fill="#7a4a1a">cobre nu · 15 mm</text>
    <!-- C4 -->
    <line x1="560" y1="110" x2="630" y2="110" stroke="#c77f3c" stroke-width="5"/>
    <line x1="630" y1="110" x2="820" y2="110" stroke="#9e9e9e" stroke-width="8"/>
    <text x="595" y="140" font-size="12" text-anchor="middle" fill="#7a4a1a">cobre nu · 15 mm</text>
    <text x="725" y="90" font-size="12" text-anchor="middle" fill="#333">C4-1 (ou C4-2)</text>
    <text x="450" y="178" font-size="13" text-anchor="middle" fill="#b71c1c">Depois de soldar, a emenda não passa mais por dentro do tubo.</text>
  </g>

  <!-- ===== 3. Enrolar e soldar ===== -->
  <g transform="translate(0,520)">
    <rect x="30" y="0" width="840" height="230" rx="12" fill="#f6f7f9" stroke="#d0d4da"/>
    <text x="50" y="30" font-size="18" font-weight="bold" fill="#111">3 · Trançar (C4-1 com PF1 · C4-2 com PF2) e soldar</text>
    <line x1="90" y1="110" x2="330" y2="110" stroke="#e53935" stroke-width="8"/>
    <rect x="150" y="97" width="80" height="26" rx="8" fill="#1e88e5" opacity="0.85"/>
    <!-- trança -->
    <path d="M330 110 q15 -12 30 0 q15 12 30 0 q15 -12 30 0 q15 12 30 0 q15 -12 30 0" stroke="#c77f3c" stroke-width="6" fill="none"/>
    <path d="M330 110 q15 12 30 0 q15 -12 30 0 q15 12 30 0 q15 -12 30 0 q15 12 30 0" stroke="#8d5a2b" stroke-width="6" fill="none"/>
    <line x1="480" y1="110" x2="720" y2="110" stroke="#9e9e9e" stroke-width="8"/>
    <text x="405" y="85" font-size="12" text-anchor="middle" fill="#7a4a1a" font-weight="bold">trança apertada</text>
    <!-- ferro -->
    <polygon points="400,175 440,135 452,147 412,187" fill="#555"/>
    <rect x="440" y="170" width="120" height="22" rx="6" fill="#333" transform="rotate(-45 440 170)"/>
    <text x="340" y="200" font-size="12" fill="#333">ferro a 350 °C por baixo da trança, 2–3 s</text>
    <!-- estanho -->
    <line x1="470" y1="60" x2="420" y2="104" stroke="#9aa" stroke-width="4"/>
    <text x="560" y="60" font-size="12" fill="#333">estanho encostado na trança, não no ferro:</text>
    <text x="560" y="78" font-size="12" fill="#333">escorre para dentro quando o cobre esquenta</text>
    <text x="450" y="222" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="bold">Boa: lisa e brilhante. Fosca e granulada = solda fria, aqueça de novo. Esfriou? Puxão forte.</text>
  </g>

  <!-- ===== 4. Encolher ===== -->
  <g transform="translate(0,770)">
    <rect x="30" y="0" width="840" height="190" rx="12" fill="#f6f7f9" stroke="#d0d4da"/>
    <text x="50" y="30" font-size="18" font-weight="bold" fill="#111">4 · Deslizar o tubo do PF sobre a emenda e encolher</text>
    <line x1="90" y1="100" x2="330" y2="100" stroke="#e53935" stroke-width="8"/>
    <rect x="320" y="84" width="170" height="32" rx="10" fill="#1565c0"/>
    <line x1="480" y1="100" x2="720" y2="100" stroke="#9e9e9e" stroke-width="8"/>
    <text x="405" y="70" font-size="12" text-anchor="middle" fill="#0d47a1" font-weight="bold">tubo centralizado na emenda</text>
    <!-- chama -->
    <path d="M405 160 q-12 -22 0 -40 q12 18 0 40 z" fill="#ff9800"/>
    <path d="M405 155 q-5 -10 0 -20 q5 10 0 20 z" fill="#ffeb3b"/>
    <text x="520" y="150" font-size="12" fill="#333">isqueiro a ≈3 cm, girando o fio, até o tubo grudar.</text>
    <text x="520" y="168" font-size="12" fill="#333">Nenhum cobre à vista. Repita na outra emenda.</text>
  </g>

  <!-- ===== 5. Resultado ===== -->
  <g transform="translate(0,980)">
    <rect x="30" y="0" width="840" height="180" rx="12" fill="#eef6ee" stroke="#9ccc9c"/>
    <text x="50" y="30" font-size="18" font-weight="bold" fill="#1b5e20">5 · Como fica, pronto para ligar</text>
    <text x="80" y="95" font-size="13" fill="#333" text-anchor="middle">fonte</text>
    <text x="80" y="112" font-size="13" fill="#333" text-anchor="middle">borne 2 (+)</text>
    <rect x="60" y="55" width="40" height="22" fill="#333"/>
    <line x1="100" y1="66" x2="200" y2="66" stroke="#9e9e9e" stroke-width="8"/>
    <rect x="195" y="52" width="60" height="28" rx="9" fill="#1565c0"/>
    <line x1="250" y1="66" x2="330" y2="66" stroke="#e53935" stroke-width="8"/>
    <rect x="330" y="36" width="180" height="60" rx="10" fill="#2b2b2b"/>
    <text x="420" y="60" font-size="12" text-anchor="middle" fill="#fff">porta-fusível</text>
    <text x="420" y="80" font-size="12" text-anchor="middle" fill="#ffcc80">tampa fechada · SEM fusível</text>
    <line x1="510" y1="66" x2="590" y2="66" stroke="#e53935" stroke-width="8"/>
    <rect x="585" y="52" width="60" height="28" rx="9" fill="#1565c0"/>
    <line x1="640" y1="66" x2="770" y2="66" stroke="#9e9e9e" stroke-width="8"/>
    <rect x="770" y="50" width="70" height="32" rx="4" fill="#333"/>
    <text x="805" y="70" font-size="11" text-anchor="middle" fill="#fff">+12VDC</text>
    <text x="805" y="112" font-size="13" fill="#333" text-anchor="middle">processador</text>
    <text x="150" y="112" font-size="12" fill="#333" text-anchor="middle">C4-1 · 10 cm</text>
    <text x="705" y="112" font-size="12" fill="#333" text-anchor="middle">C4-2 · 40 cm</text>
    <text x="225" y="40" font-size="11" fill="#0d47a1" text-anchor="middle">emenda A (PF1)</text>
    <text x="615" y="40" font-size="11" fill="#0d47a1" text-anchor="middle">emenda B (PF2)</text>
    <text x="450" y="155" font-size="13" text-anchor="middle" fill="#333">C5 vai direto ao borne 5 (−) da fonte, sem porta-fusível. Bornes 7, 8 e 9 são a rede: não encoste.</text>
  </g>
</svg>
